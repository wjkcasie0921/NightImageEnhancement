data_root: ./datasets/LOL
save_dir: ./checkpoints
epochs: 120
batch_size: 8
lr: 3.0e-4
min_lr: 1.0e-6
image_size: 320
num_workers: 2
width: 24
max_param_mb: 2.0
grad_clip: 1.0
eval_every: 1
loss_weights:
  lambda_smooth: 0.08
  lambda_grad: 0.2
  lambda_color: 0.05
  lambda_exposure: 0.15
  lambda_ratio: 0.08
  lambda_denoise: 0.04
